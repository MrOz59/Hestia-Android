apply plugin: 'com.android.application'

// This override is only supplied by the automated nightly workflow.
// It gives consecutive nightlies increasing versions for in-place upgrades.
def nightlyBuildNumber = System.getenv("HESTIA_NIGHTLY_BUILD_NUMBER")
def nightlyVersionCode = nightlyBuildNumber ? 100000 + Integer.parseInt(nightlyBuildNumber) : null

android {
    ndkVersion "27.0.12077973"

    compileSdk = 36

    namespace 'com.limelight'

    defaultConfig {
        minSdk 21
        targetSdk 34

        versionName "20.2.6"
        versionCode = nightlyVersionCode != null ? nightlyVersionCode : 57

        // Generate native debug symbols to allow Google Play to symbolicate our native crashes
        ndk.debugSymbolLevel = 'FULL'
    }

    flavorDimensions.add("root")

    buildFeatures {
        buildConfig = true
    }

    productFlavors {
        root {
            // Android O has native mouse capture, so don't show the rooted
            // version to devices running O on the Play Store.
            maxSdk 25

            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=root"
                }
            }

            resValue "string",
                    "obtainium_app_url",
                    "data:text/html;base64,PGgxPlJvb3QgYnVpbGQgaXMgbm90IGF2YWlsYWJsZTwvaDE+"

            // Different from Artemis and Moonlight; can be installed side by side.
            applicationId "com.mroz59.hestia.root"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "true"
        }

        nonRoot_game {
            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=nonRoot"
                }
            }

            resValue "string",
                    "obtainium_app_url",
                    "https://apps.obtainium.imranr.dev/redirect?r=obtainium://app/%7B%22id%22%3A%22com.mroz59.hestia%22%2C%22url%22%3A%22https%3A%2F%2Fgithub.com%2FMrOz59%2FHestia-Android%22%2C%22author%22%3A%22MrOz59%22%2C%22name%22%3A%22Hestia%20Android%22%2C%22additionalSettings%22%3A%22%7B%5C%22apkFilterRegEx%5C%22%3A%5C%22nonRoot%5C%22%2C%5C%22matchGroupToUse%5C%22%3A%5C%22%241%5C%22%2C%5C%22versionExtractionRegEx%5C%22%3A%5C%22v(.%2B)%5C%22%7D%22%7D"

            applicationId "com.mroz59.hestia"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "false"
        }
    }

    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        disable 'MissingTranslation'
        lintConfig file('lint.xml')
    }

    bundle {
        language {
            // Avoid splitting by language, since we allow users
            // to manually switch language in settings.
            enableSplit = false
        }
        density {
            // FIXME: This should not be necessary but we get
            // weird crashes due to missing drawable resources
            // when this split is enabled.
            enableSplit = false
        }
    }

    packaging {
        resources {
            pickFirsts.add('META-INF/versions/9/OSGI-INF/MANIFEST.MF')
        }
    }

    signingConfigs {
        // When a persistent signing key is configured in GitHub Actions,
        // use it for nightlies. Otherwise the cloned debug config is used,
        // which is valid for installation but may change between CI runners.
        if (System.getenv("HESTIA_NIGHTLY_KEYSTORE_PATH")) {
            nightly {
                storeFile file(System.getenv("HESTIA_NIGHTLY_KEYSTORE_PATH"))
                storePassword System.getenv("HESTIA_NIGHTLY_STORE_PASSWORD")
                keyAlias System.getenv("HESTIA_NIGHTLY_KEY_ALIAS")
                keyPassword System.getenv("HESTIA_NIGHTLY_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            resValue "string", "app_label", "Hestia Dev"
            resValue "string", "app_label_root", "Hestia Dev (Root)"
            resValue "string", "app_label_game", "Hestia Dev (Game)"

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        nightly {
            initWith debug
            applicationIdSuffix ".nightly"
            versionNameSuffix "-nightly.${nightlyBuildNumber ?: 'local'}"
            resValue "string", "app_label", "Hestia Nightly"
            resValue "string", "app_label_root", "Hestia Nightly (Root)"
            resValue "string", "app_label_game", "Hestia Nightly (Game)"

            if (System.getenv("HESTIA_NIGHTLY_KEYSTORE_PATH")) {
                signingConfig signingConfigs.nightly
            }
        }
        release {
            // The flavor application IDs already belong to Hestia. Do not use
            // Moonlight/Artemis identifiers or their .noir suffix.
            resValue "string", "app_label", "Hestia"
            resValue "string", "app_label_root", "Hestia (Root)"
            resValue "string", "app_label_game", "Hestia (Game)"

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "x86", "x86_64", "armeabi-v7a", "arm64-v8a"
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation 'org.bouncycastle:bcprov-jdk18on:1.81'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.81'
    implementation 'org.jcodec:jcodec:0.2.5'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jmdns:jmdns:3.6.2'
    implementation 'com.github.cgutman:ShieldControllerExtensions:1.0.1'
    implementation 'com.google.code.gson:gson:2.13.1'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.github.ByteHamster:SearchPreference:v2.5.1'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'com.google.ai.edge.litert:litert:1.4.0'
    implementation 'com.google.ai.edge.litert:litert-gpu:1.4.0'
    implementation 'org.opencv:opencv:4.12.0'

    // Unit test dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'org.robolectric:robolectric:4.16'
    testImplementation 'org.mockito:mockito-core:5.19.0'
}
